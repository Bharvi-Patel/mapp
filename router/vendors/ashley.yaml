vendor_id: ashley
version: "0.1"

# Source columns on pim_raw_items (from the RawItem model). item_code lives on pim_products, not raw items.
field_map:
  name: itemFriendlyDesc          # fall back to itemName when empty
  description: itemDesc
  item_type: itemType
  item_class: itemClass
  item_code: pim_products.item_code
  vendor_category_path: navigableCategories   # API field: list of cumulative ' - ' paths, e.g. ['Bedroom', 'Bedroom - Bedroom Furniture', 'Bedroom - Bedroom Furniture - Beds'].
  # Not stored on pim_raw_items; fetch_navcats.py exports it. cascade.nav_code turns a path into the ashley_category code
  # (uppercase, drop spaces and hyphens: BEDROOMBEDROOMFURNITUREBEDS). ['Uncategorized'] = no vendor category.

settings:
  trust_vendor_path: false
  thresholds: null                # null = model answers always go to review until Phase 5 sets real values
  model_spend_cap_per_batch: null

excluded_slugs: [component-skus, uncategorized, store-displays]
# Also excluded: every slug starting with these. The component-skus-* leaves (bedroom, living-room, outdoor, ...) hold parts
# such as footboards, rails, corner chairs and cushions. On the real navigableCategories 22 of 28 wrong exact-path
# assignments went there, while the key places these products in beds, headboards, sofas and so on.
excluded_slug_prefixes: [component-skus-]
min_pool_support: 2

# Package item_codes -> set category. Each row below matches where all of that code's products are
# already linked today (checked on the dev data: 2,387 of 2,388 packages have exactly one set link).
package_rules:
  "Bedroom Package": bedroom-sets
  "Dining Package": dining-room-sets
  "Stationary Upholstery Package": living-room-sets
  "Motion Upholstery Package": living-room-sets
  "Occasional Table Package": living-room-sets
  "Chair and Ottoman Package": living-room-sets
  "Outdoor Seating Package": outdoor-sets
  "Outdoor Dining Package": outdoor-sets
  "Home Office Package": home-office-sets
  "Foundation Package": mattresses-and-bedding-sets
  # "Outdoor Package": 2 products linked to slug outdoor-package, not outdoor-sets. Decide before adding.
# Known exception: 1 Bedroom Package product is linked to kids-furniture categories, not bedroom-sets.
# The rule would send it to bedroom-sets; consider sending it to review.

# Item classes whose items should never get model options (sent to review). Decision pending with the catalog owner.
review_classes:
  - STAT PUR REPLACEMENTS     # 202 replacement cushions (chaise/ottoman/seat); no category fits yet
parent_fallback: true         # class linked only to a parent category -> offer that parent's leaf categories

pools_file: evidence_out/pools.json      # leaf-only, min support 2 (build_evidence.py)
vendor_map_file: evidence_out/vendor_map_reviewed.csv   # proposal only until the REVIEW column is filled
# --- Routing / answer-key rulings (settled on the 219-row test set) ---
# SKU-prefix rules run before everything else. StoreDisplay items (fixtures, display mattresses,
# replacement cushions) are hidden by design: store-displays is a disabled category, the 3 such
# products in the store sit in it, and a live-site search for "StoreDisplay" shows nothing.
# A rule target may be an excluded slug; excluded_slugs only limits what the model is offered.
sku_prefix_rules:
  "100-": store-displays

# When the two labelers split between two placements, prefer the first. A product keeps its other
# placements anyway, so this only picks the primary. A pattern ending in "-" matches a slug prefix.
tie_prefer:
  - {prefer: mattresses-by-size-, over: mattresses-and-bases-by-type-}
  - {prefer: dining-furniture-dining-room-counter-tables, over: bar-furniture-counter-tables}

# Cascade settings. thresholds: null = fail closed (model picks always go to review) until Phase 5 sets them;
# later a map of option-count upper bound -> minimum confidence, e.g. {3: 0.80, 8: 0.85, 999: 0.90}.
# contradictions: a vendor-path category is rejected when the product name says otherwise.
#   - {slug_prefix: "rugs-", name_pattern: "\\b(pillow|throw|blanket)\\b"}
contradictions: []